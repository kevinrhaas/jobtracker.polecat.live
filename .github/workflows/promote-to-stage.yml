name: Promote dev to stage

# The pipeline's FULL gate (docs/PIPELINE.md). Merges dev into stage, runs the
# whole smoke suite against the STAGED /stage/ form (stage-preview.mjs output, so
# path-rewrite bugs are caught here too), and either publishes the new /stage/
# preview or rolls stage straight back to its pre-promotion commit. The green/red
# outcome of this workflow IS the stage status record — promote-to-prod.yml and
# Manager read it from the Actions API; there is no separate state file.
#
# Fires on:
#   • manual dispatch (Kevin or Manager) — always promotes, schedule ignored
#   • an hourly cron tick, gated by .github/pipeline.json via
#     pipeline-schedule.mjs (enabled / paused / everyHours / offset / window),
#     so the cadence is editable without touching this file
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this promotion is being run (free text, for the log)
        required: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: promote-to-stage
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schedule gate (cron ticks only — dispatch always promotes)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if node .github/pipeline-schedule.mjs; then
              echo "due=true" >> "$GITHUB_OUTPUT"
            else
              echo "due=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into dev (hotfix back-merge), then dev into stage
        id: merge
        if: steps.gate.outputs.due == 'true'
        run: |
          set -e
          git config user.name  "polecat-ci"
          git config user.email "ci@polecat.live"
          if ! git fetch origin dev stage 2>/dev/null; then
            echo "::error::dev/stage branches missing — dispatch pipeline-setup.yml first."
            exit 1
          fi

          # Back-merge: dev must stay a superset of main so hotfixes are never
          # lost at the next promotion. A conflict here needs a human — abort
          # and report rather than guess.
          git checkout -B dev origin/dev
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            gh issue create --title "stage promotion blocked: main→dev back-merge conflict" \
              --body "Automatic back-merge of main into dev hit conflicts and was aborted. Resolve on dev, then re-dispatch promote-to-stage. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            echo "::error::main→dev back-merge conflicted."
            exit 1
          fi
          git push origin dev

          STAGE_PREV="$(git rev-parse origin/stage)"
          echo "stage_prev=$STAGE_PREV" >> "$GITHUB_OUTPUT"
          git checkout -B stage origin/stage
          COUNT="$(git rev-list --count stage..dev)"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to promote — stage already contains dev."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="$(git rev-parse --short stage)..$(git rev-parse --short dev)"
          git merge --no-ff dev -m "Promote dev→stage: $COUNT commit(s) ($RANGE)"
          git push origin stage
          echo "promoted=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Playwright (Chromium + WebKit)
        if: steps.merge.outputs.promoted == 'true'
        run: |
          npm install playwright --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Full suite against the STAGED /stage/ form
        id: suite
        if: steps.merge.outputs.promoted == 'true'
        run: |
          set -e
          # Working tree is the freshly-promoted stage. Assemble it exactly as
          # deploy.yml will (./stage/ with rewritten paths, stub SW, banner) and
          # run the whole smoke suite against that staged form.
          node .github/stage-preview.mjs . stage "$(git rev-parse --short stage)"
          SMOKE_PREFIX=/stage node .github/smoke-test.mjs

      - name: "Red: roll stage back to its pre-promotion commit"
        if: failure() && steps.merge.outputs.promoted == 'true'
        run: |
          STAGE_PREV="${{ steps.merge.outputs.stage_prev }}"
          STAGE_NOW="$(git rev-parse stage)"
          # stage is a machine-owned pointer; this lease only rewinds the exact
          # merge this run just pushed. main is never force-pushed, anywhere.
          git push --force-with-lease=refs/heads/stage:"$STAGE_NOW" origin "$STAGE_PREV":refs/heads/stage
          gh issue create --title "stage promotion failed: suite red, stage rolled back" \
            --body "The full suite failed against the staged /stage/ build, so stage was rolled back to \`${STAGE_PREV}\`. dev still carries the promoted commits — fix on dev and re-promote. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          echo "::error::stage suite failed — stage rolled back to ${STAGE_PREV}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Green: publish the new /stage/ preview"
        if: success() && steps.merge.outputs.promoted == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
