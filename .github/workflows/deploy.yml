name: Deploy to GitHub Pages

# Static site — no build step. The SINGLE deploy authority for the site,
# served at the custom domain (see CNAME: jobtracker.polecat.live). The Pages
# artifact now carries THREE stages of the promotion pipeline
# (docs/PIPELINE.md):
#   /        production  = main            (untouched, real sw.js, indexed)
#   /qa/     candidate   = the qa branch   (stage-preview: rewritten paths,
#   /dev/    integration = the dev branch    stub SW, noindex, stage banner)
# The stage steps no-op while the qa/dev refs don't exist, so this workflow is
# safe to merge before the pipeline is ever activated (pipeline-setup.yml
# creates the refs). Any stage's push republishes the whole artifact — main is
# always assembled at the root regardless of which branch triggered the run.
# Runs on:
#   • push to main / qa / dev (human or PAT pushes; the promotion workflows
#     push with GITHUB_TOKEN which can't trigger `push`, so they dispatch this
#     workflow explicitly — same bridge auto-revert relies on)
#   • completion of the self-improvement fallback workflow
#   • manual dispatch
on:
  push:
    branches: [main, qa, dev]
  workflow_run:
    workflows: ["Self-improvement (dispatch-only fallback)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time to the github-pages environment; let an in-progress
# deploy finish before the next starts (prevents "deployment_queued" stalls).
concurrency:
  group: jobtracker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (production is always the artifact root)
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble /qa/ and /dev/ stage previews (no-op until the refs exist)
        run: |
          for stage in qa dev; do
            if git fetch origin "$stage" 2>/dev/null; then
              sha="$(git rev-parse --short FETCH_HEAD)"
              git worktree add "_${stage}-src" FETCH_HEAD
              node .github/stage-preview.mjs "_${stage}-src" "$stage" "$sha"
              git worktree remove --force "_${stage}-src"
            else
              echo "stage-preview: no '$stage' ref yet — skipping /$stage/"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo (index.html, app/, css/, js/, assets, CNAME)
          # plus the assembled /qa/ and /dev/ preview directories.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
