name: Promote stage to prod

# Ship a tested stage candidate to production (docs/PIPELINE.md). Dispatch-only —
# prod NEVER promotes on a schedule. Refuses while the latest stage promotion run
# is red (pipeline.json requireGreenStageForProd), unless dispatched with force.
# Promotion = a --no-ff merge of stage into main + a release-vNNN tag + a frozen
# /v/<n>/ snapshot (archive-release.mjs), so every release is rollback-able
# both by rollback-prod.yml (git revert) and by the in-app version switcher.
#
# The deploy itself stays ungated: this workflow gates the PROMOTION, and a
# hotfix merged straight to main bypasses it entirely (the fleet's
# "promotion is gated, deploy is not" doctrine).
on:
  workflow_dispatch:
    inputs:
      force:
        description: Promote even if the latest stage promotion run is red
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require a green stage (unless forced or disabled in pipeline.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRE="$(node -e "console.log(require('./.github/pipeline.json').requireGreenStageForProd !== false)")"
          if [ "${{ inputs.force }}" = "true" ] || [ "$REQUIRE" != "true" ]; then
            echo "stage-green check skipped (force=${{ inputs.force }}, require=$REQUIRE)."
            exit 0
          fi
          LAST="$(gh run list --workflow=promote-to-stage.yml --status=completed --limit=1 --json conclusion --jq '.[0].conclusion // "none"')"
          echo "latest completed stage promotion: $LAST"
          if [ "$LAST" != "success" ] && [ "$LAST" != "none" ]; then
            echo "::error::Latest stage promotion is '$LAST'. Fix stage (or dispatch with force) before promoting to prod."
            exit 1
          fi

      - name: Merge stage into main, tag the release, freeze the /v/ snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  "polecat-ci"
          git config user.email "ci@polecat.live"
          if ! git fetch origin stage 2>/dev/null; then
            echo "::error::stage branch missing — dispatch pipeline-setup.yml first."
            exit 1
          fi
          COUNT="$(git rev-list --count main..origin/stage)"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to promote — main already contains stage."
            exit 0
          fi
          V="$(grep -oE 'v:\s*[0-9]+' js/changelog.js | head -1 | grep -oE '[0-9]+')"
          git merge --no-ff origin/stage -m "Promote stage→prod (release v${V}): $COUNT commit(s)"
          # Read the (possibly merge-updated) version for the tag + snapshot.
          V="$(grep -oE 'v:\s*[0-9]+' js/changelog.js | head -1 | grep -oE '[0-9]+')"
          node .github/archive-release.mjs
          git add -A
          git commit -m "Archive release v${V} (/v/${V}/ snapshot + manifest)" || true
          git tag -f "release-v${V}"
          git push origin main "refs/tags/release-v${V}"
          echo "Promoted stage→prod as release v${V}."

      - name: Publish (GITHUB_TOKEN pushes don't trigger deploy — dispatch it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
