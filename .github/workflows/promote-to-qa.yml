name: Promote dev to qa

# The pipeline's FULL gate (docs/PIPELINE.md). Merges dev into qa, runs the
# whole smoke suite against the STAGED /qa/ form (stage-preview.mjs output, so
# path-rewrite bugs are caught here too), and either publishes the new /qa/
# preview or rolls qa straight back to its pre-promotion commit. The green/red
# outcome of this workflow IS the qa status record — promote-to-prod.yml and
# Manager read it from the Actions API; there is no separate state file.
#
# Fires on:
#   • manual dispatch (Kevin or Manager) — always promotes, schedule ignored
#   • an hourly cron tick, gated by .github/pipeline.json via
#     pipeline-schedule.mjs (enabled / paused / everyHours / offset / window),
#     so the cadence is editable without touching this file
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this promotion is being run (free text, for the log)
        required: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: promote-to-qa
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schedule gate (cron ticks only — dispatch always promotes)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if node .github/pipeline-schedule.mjs; then
              echo "due=true" >> "$GITHUB_OUTPUT"
            else
              echo "due=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into dev (hotfix back-merge), then dev into qa
        id: merge
        if: steps.gate.outputs.due == 'true'
        run: |
          set -e
          git config user.name  "polecat-ci"
          git config user.email "ci@polecat.live"
          if ! git fetch origin dev qa 2>/dev/null; then
            echo "::error::dev/qa branches missing — dispatch pipeline-setup.yml first."
            exit 1
          fi

          # Back-merge: dev must stay a superset of main so hotfixes are never
          # lost at the next promotion. A conflict here needs a human — abort
          # and report rather than guess.
          git checkout -B dev origin/dev
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            gh issue create --title "qa promotion blocked: main→dev back-merge conflict" \
              --body "Automatic back-merge of main into dev hit conflicts and was aborted. Resolve on dev, then re-dispatch promote-to-qa. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            echo "::error::main→dev back-merge conflicted."
            exit 1
          fi
          git push origin dev

          QA_PREV="$(git rev-parse origin/qa)"
          echo "qa_prev=$QA_PREV" >> "$GITHUB_OUTPUT"
          git checkout -B qa origin/qa
          COUNT="$(git rev-list --count qa..dev)"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to promote — qa already contains dev."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="$(git rev-parse --short qa)..$(git rev-parse --short dev)"
          git merge --no-ff dev -m "Promote dev→qa: $COUNT commit(s) ($RANGE)"
          git push origin qa
          echo "promoted=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Playwright (Chromium + WebKit)
        if: steps.merge.outputs.promoted == 'true'
        run: |
          npm install playwright --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Full suite against the STAGED /qa/ form
        id: suite
        if: steps.merge.outputs.promoted == 'true'
        run: |
          set -e
          # Working tree is the freshly-promoted qa. Assemble it exactly as
          # deploy.yml will (./qa/ with rewritten paths, stub SW, banner) and
          # run the whole smoke suite against that staged form.
          node .github/stage-preview.mjs . qa "$(git rev-parse --short qa)"
          SMOKE_PREFIX=/qa node .github/smoke-test.mjs

      - name: "Red: roll qa back to its pre-promotion commit"
        if: failure() && steps.merge.outputs.promoted == 'true'
        run: |
          QA_PREV="${{ steps.merge.outputs.qa_prev }}"
          QA_NOW="$(git rev-parse qa)"
          # qa is a machine-owned pointer; this lease only rewinds the exact
          # merge this run just pushed. main is never force-pushed, anywhere.
          git push --force-with-lease=refs/heads/qa:"$QA_NOW" origin "$QA_PREV":refs/heads/qa
          gh issue create --title "qa promotion failed: suite red, qa rolled back" \
            --body "The full suite failed against the staged /qa/ build, so qa was rolled back to \`${QA_PREV}\`. dev still carries the promoted commits — fix on dev and re-promote. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          echo "::error::qa suite failed — qa rolled back to ${QA_PREV}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Green: publish the new /qa/ preview"
        if: success() && steps.merge.outputs.promoted == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
